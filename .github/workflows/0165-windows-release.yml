name: ENGE SPX 0.16.5 Windows package
on:
  push:
    branches: [checks/0.16.5-windows-package]
    paths: ['.github/workflows/0165-windows-release.yml']
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src;tests
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build the release source
        shell: pwsh
        run: |
          $source = '18b2cf3b280782f76790aab4126fbf4e0d9592ba'
          if ((git rev-parse HEAD^) -ne $source) { throw 'Unexpected release source.' }
          if ((git diff --name-only $source HEAD) -ne '.github/workflows/0165-windows-release.yml') { throw 'Build and release source differ.' }
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./packaging/windows/Build-Windows.ps1 -Python (Join-Path $env:pythonLocation 'python.exe')
      - uses: actions/upload-artifact@v4
        with:
          name: ENGE-SPX-Windows-x64-0.16.5
          path: |
            dist/ENGE-SPX-Windows-x64-0.16.5-Portable.zip
            dist/ENGE-SPX-Windows-x64-0.16.5-Setup.exe
            dist/*.sha256
          if-no-files-found: error
      - name: Verify the frozen package and installer
        shell: pwsh
        run: |
          $expected = '0.16.5'
          $actual = & ./dist/ENGE-SPX/spx.exe --version
          if ($LASTEXITCODE -ne 0 -or $actual -ne $expected) { throw 'Frozen CLI version differs from source.' }
          foreach ($executable in @('ENGE-SPX.exe', 'spx.exe')) {
            $info = (Get-Item (Join-Path 'dist/ENGE-SPX' $executable)).VersionInfo
            if ($info.ProductVersion -ne $expected -or $info.FileVersion -ne $expected -or $info.IsPreRelease) { throw 'Incorrect executable version metadata.' }
          }
          $installed = Join-Path $env:RUNNER_TEMP 'spx-0165-installed'
          $setup = Start-Process -FilePath "dist/ENGE-SPX-Windows-x64-$expected-Setup.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$installed" -PassThru -Wait
          if ($setup.ExitCode -ne 0 -or -not (Test-Path "$installed/ENGE-SPX.exe")) { throw 'Setup failed.' }
          $smoke = Join-Path $env:RUNNER_TEMP 'spx-0165-smoke'
          $gui = Start-Process -FilePath "$installed/ENGE-SPX.exe" -ArgumentList '--data', $smoke, '--smoke-gui' -PassThru
          if (-not $gui.WaitForExit(20000) -or $gui.ExitCode -ne 0) { throw 'Installed GUI startup failed.' }
