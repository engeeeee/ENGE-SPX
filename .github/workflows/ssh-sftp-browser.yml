name: Native SSH inline completion and SFTP browser

on:
  push:
    branches: [test/sftp-inline-01516]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 14
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt paramiko==4.0.0
      - name: Verify SSH and terminal regressions
        working-directory: tests
        env:
          PYTHONPATH: ../src
        run: python -m unittest -q test_terminal_rendering test_terminal_usability test_ssh_client test_workspace_ui
      - run: python tools/prepare_windows_conpty.py
      - name: Build the frozen OpenSSH credential helper
        run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath build packaging/windows/SPX.spec
      - name: Exercise native OpenSSH and SFTP through the Windows interface
        run: python -u tests/integration_ssh_terminal.py --helper dist/ENGE-SPX/spx.exe
