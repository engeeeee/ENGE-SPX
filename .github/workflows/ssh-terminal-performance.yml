name: SSH terminal latency and history

on:
  push:
    branches: [test/ssh-terminal-performance-01514]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt paramiko==4.0.0
      - name: Benchmark both revisions on one Windows runner
        shell: pwsh
        run: |
          git worktree add --detach "$env:RUNNER_TEMP/spx-base" d9226f66763ea314b31a37516f24c09c80495c0a
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/probe_terminal_scroll.py --source "$env:RUNNER_TEMP/spx-base/src" --ssh-history --frames 60 --output "$env:RUNNER_TEMP/ssh-baseline.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/probe_terminal_scroll.py --ssh-history --frames 60 --output "$env:RUNNER_TEMP/ssh-optimized.json"
      - name: Test terminal rendering, editing and saved SSH settings
        working-directory: tests
        env:
          PYTHONPATH: ../src
        run: python -m unittest -q test_terminal_rendering test_terminal_usability test_terminal_preferences test_ssh_client
      - name: Verify translucent history at 125 percent scaling
        working-directory: tests
        env:
          PYTHONPATH: ../src
          QT_SCALE_FACTOR: '1.25'
        run: python -m unittest -q test_terminal_rendering.TerminalRenderingTests.test_ssh_incremental_scroll_matches_a_full_redraw
      - run: python tools/prepare_windows_conpty.py
      - name: Native Windows OpenSSH conversation and input
        env:
          PYTHONPATH: src
        run: python -u tests/integration_ssh_terminal.py --transcript-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ssh-terminal-performance
          path: ${{ runner.temp }}/ssh-*.json
          if-no-files-found: warn
