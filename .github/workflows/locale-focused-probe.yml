name: Locale focused probe
on:
  push:
    branches: [locale-focused-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Use verified existing runtime and capture browser diagnostics
        run: python tools/locale_focused_probe.py
