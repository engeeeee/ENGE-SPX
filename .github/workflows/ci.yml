name: ENGE SPX Windows

on:
  workflow_dispatch:
  push:
    branches: [main, enge-spx-build]
    paths: ['src/**', 'tests/**', 'tools/**', 'packaging/**', 'requirements*.txt', 'pyproject.toml', '.github/workflows/ci.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'tools/**', 'packaging/**', 'requirements*.txt', 'pyproject.toml', '.github/workflows/ci.yml']

permissions:
  contents: read

concurrency:
  group: enge-spx-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: src
  SPX_CLIENT_RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && (contains(github.event.head_commit.message, '[client-update]') || contains(github.event.head_commit.message, '[ui-hotfix]')) && 'true' || 'false' }}

  SPX_UI_HOTFIX: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[ui-hotfix]') && 'true' || 'false' }}

jobs:
  supersede:
    if: github.repository == 'engeeeee/ENGE-SPX' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const current = Number(process.env.GITHUB_RUN_NUMBER);
            const runs = (await github.rest.actions.listWorkflowRuns({owner, repo, workflow_id: 'ci.yml', branch: 'main', per_page: 30})).data.workflow_runs;
            for (const run of runs) {
              if (run.event !== 'push' || run.head_repository?.full_name !== `${owner}/${repo}` || run.run_number >= current || !['queued', 'in_progress'].includes(run.status)) continue;
              await github.rest.actions.cancelWorkflowRun({owner, repo, run_id: run.id});
              core.notice('Superseded an older build: ' + run.id);
            }
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - if: runner.os == 'Linux'
        name: Install Qt offscreen system libraries
        run: |
          # Keep Ubuntu's archive keyring and source suites; use a reachable HTTPS mirror.
          printf 'https://mirrors.edge.kernel.org/ubuntu/\tpriority:1\n' | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=30 install -y --no-install-recommends libegl1 libgl1 libxkbcommon0
      - run: python tools/check_repository.py
      - name: Verify formal release publication and immutable assets
        run: node --test tests/test_release_publication.cjs
      - run: python -m unittest discover -s tests -v
        if: env.SPX_UI_HOTFIX != 'true' && (runner.os != 'Windows' || env.SPX_CLIENT_RELEASE != 'true')
        env:
          PYTHONPATH: src
      - name: Targeted timezone selector and startup regression
        if: env.SPX_UI_HOTFIX == 'true'
        run: python -m unittest discover -s tests -p 'test_app_update_ui.py' -v
      - name: Focused Windows client, update and exit regression
        if: runner.os == 'Windows' && env.SPX_CLIENT_RELEASE == 'true' && env.SPX_UI_HOTFIX != 'true'
        run: python tools/test_client_release.py
      - if: runner.os == 'Windows' && env.SPX_UI_HOTFIX != 'true'
        run: python tools/smoke_gui.py
        env:
          SPX_UI_REPORT_DIR: ${{ runner.temp }}/spx-ui-checks
      - if: runner.os == 'Windows' && env.SPX_UI_HOTFIX != 'true'
        name: Check high DPI branding and primary actions
        shell: pwsh
        env:
          SPX_UI_REPORT_DIR: ${{ runner.temp }}/spx-ui-checks
        run: |
          foreach ($scale in @('1.25', '1.5', '2')) {
            $env:QT_SCALE_FACTOR = $scale
            python tools/check_ui_dpi.py
            if ($LASTEXITCODE -ne 0) { throw "DPI layout failed: $scale" }
          }
      - if: runner.os == 'Windows' && env.SPX_UI_HOTFIX != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ENGE-SPX-UI-0.15.1
          path: ${{ runner.temp }}/spx-ui-checks
          if-no-files-found: error
      - if: runner.os == 'Windows' && env.SPX_UI_HOTFIX != 'true'
        shell: pwsh
        run: ./tools/Update-Repository.ps1 -WhatIf
      - if: runner.os == 'Windows' && env.SPX_UI_HOTFIX != 'true'
        name: Generate disposable Smart Clipboard acceptance fixtures
        shell: pwsh
        run: ./tools/Test-SmartClipboard.ps1 -Project (Join-Path $env:RUNNER_TEMP 'smart-clipboard-acceptance')
  package:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build Windows executables
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          ./packaging/windows/Build-Windows.ps1 -Python (Join-Path $env:pythonLocation 'python.exe')
      - name: Verify real portable and installed client update handoff
        if: env.SPX_UI_HOTFIX != 'true'
        shell: pwsh
        run: ./.venv-build/Scripts/python.exe tests/integration_app_update.py --bundle dist/ENGE-SPX-Windows-x64-0.15.1-Portable.zip --setup dist/ENGE-SPX-Windows-x64-0.15.1-Setup.exe --output '${{ runner.temp }}/app-update-e2e.json'
      - name: Verify caption click restores terminal material
        if: env.SPX_UI_HOTFIX != 'true'
        shell: pwsh
        run: ./.venv-build/Scripts/python.exe tools/probe_windows_terminal_window.py --output '${{ runner.temp }}/terminal-caption.json'
      - name: Retain client update acceptance
        uses: actions/upload-artifact@v4
        if: always() && env.SPX_UI_HOTFIX != 'true'
        with:
          name: ENGE-SPX-Client-Update-Acceptance
          path: |
            ${{ runner.temp }}/app-update-e2e.json
            ${{ runner.temp }}/terminal-caption*
          if-no-files-found: warn
      - name: Verify packaged CLI
        shell: pwsh
        run: |
          & ./dist/ENGE-SPX/spx.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Packaged CLI check failed.' }
          $selfTest = & ./dist/ENGE-SPX/spx.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Packaged proxy transports/resources failed.' }
          $selfTest | Write-Output
          $runtime = $selfTest | ConvertFrom-Json
          if ($runtime.python -notlike '3.12.*') { throw 'Packaged Python differs from the source test interpreter.' }
          if ($runtime.dpi_awareness -ne 'per-monitor-v2') { throw 'Packaged client is not per-monitor DPI aware.' }
          $smokeHome = Join-Path $env:RUNNER_TEMP 'spx-packaged-smoke'
          $budgets = & ./dist/ENGE-SPX/spx.exe --data $smokeHome resources --show-settings
          if ($LASTEXITCODE -ne 0 -or ($budgets | ConvertFrom-Json).schema -ne 1) { throw 'Packaged resource settings failed.' }
          $profiles = & ./dist/ENGE-SPX/spx.exe --data $smokeHome profiles list
          if ($LASTEXITCODE -ne 0 -or ($profiles | ConvertFrom-Json).selected -ne 'shared') { throw 'Packaged default workspace profile failed.' }
          $network = & ./dist/ENGE-SPX/spx.exe --data $smokeHome network-check --skip-browser
          if ($LASTEXITCODE -ne 0 -or ($network | ConvertFrom-Json).status -ne 'not_ready') { throw 'Packaged inactive network diagnostics failed.' }
          $networkPerformance = & ./dist/ENGE-SPX/spx.exe --data $smokeHome network-test
          if ($LASTEXITCODE -ne 0 -or ($networkPerformance | ConvertFrom-Json).status -ne 'not_ready') { throw 'Packaged inactive network measurement failed.' }
          $recordFile = Join-Path $smokeHome 'field-recording.json'
          $recording = & ./dist/ENGE-SPX/spx.exe --data $smokeHome resources --record $recordFile --seconds 5 --interval 5 --activity gui_idle
          if ($LASTEXITCODE -ne 0 -or ($recording | ConvertFrom-Json).sample_count -lt 1) { throw 'Packaged field recorder failed.' }
          $evidence = Get-Content $recordFile -Raw | ConvertFrom-Json
          if ($evidence.kind -ne 'resource_recording' -or $evidence.source -ne 'cli') { throw 'Packaged record metadata differs.' }
          & ./dist/ENGE-SPX/spx.exe --data $smokeHome relay
          if ($LASTEXITCODE -ne 0) { throw 'Packaged relay import check failed.' }
          & ./dist/ENGE-SPX/spx.exe --data $smokeHome forward
          if ($LASTEXITCODE -ne 0) { throw 'Packaged forwarding imports failed.' }
          $gui = Start-Process -FilePath ./dist/ENGE-SPX/ENGE-SPX.exe -ArgumentList '--data', $smokeHome, '--smoke-gui' -PassThru
          if (-not $gui.WaitForExit(20000) -or $gui.ExitCode -ne 0) { throw 'Packaged GUI startup failed.' }
          $timing = Get-Content (Join-Path $smokeHome 'ui-smoke.json') | ConvertFrom-Json
          Write-Output "First GUI paint: $($timing.first_paint_ms) ms"
          if (-not $timing.icons -or $timing.app -ne 'ENGE SPX') { throw 'Packaged application identity or icons missing.' }
          if (-not $timing.custom_frame -or -not $timing.native_frame) { throw 'Packaged native custom frame missing.' }
          if ($timing.toolkit -ne 'Qt' -or -not $timing.brand_visible) { throw 'Packaged Qt interface or complete product name missing.' }
          $metadata = (Get-Item './dist/ENGE-SPX/ENGE-SPX.exe').VersionInfo
          if ($metadata.ProductName -ne 'ENGE SPX' -or $metadata.CompanyName -ne 'engeeeee') { throw 'Executable branding differs.' }
          foreach ($executable in @('ENGE-SPX.exe', 'spx.exe')) {
            $versionInfo = (Get-Item (Join-Path './dist/ENGE-SPX' $executable)).VersionInfo
            if ($versionInfo.ProductVersion -ne $runtime.version -or $versionInfo.FileVersion -ne $runtime.version -or $versionInfo.IsPreRelease) { throw 'Executable is not the expected formal version.' }
          }
      - name: Verify real DPAPI in the frozen Windows CLI
        run: python tools/check_frozen_credentials.py dist/ENGE-SPX/spx.exe
      - name: Verify frozen GUI keeps Docker startup manual
        if: env.SPX_UI_HOTFIX != 'true'
        shell: pwsh
        run: python tests/test_gui_startup.py --packaged dist/ENGE-SPX/ENGE-SPX.exe
      - name: Verify per-user setup and uninstall
        shell: pwsh
        run: |
          $appDir = Join-Path $env:RUNNER_TEMP 'spx-installed'
          $setup = Start-Process -FilePath ./dist/ENGE-SPX-Windows-x64-0.15.1-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$appDir" -PassThru -Wait
          if ($setup.ExitCode -ne 0 -or -not (Test-Path "$appDir/ENGE-SPX.exe")) { throw 'Setup failed.' }
          & "$appDir/spx.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'Installed CLI failed.' }
          $startMenu = [Environment]::GetFolderPath('Programs')
          if (-not (Test-Path (Join-Path $startMenu 'ENGE SPX.lnk'))) { throw 'Start-menu shortcut missing.' }
          $privateData = Join-Path $env:LOCALAPPDATA 'ENGE-SPX'
          New-Item -ItemType Directory -Path $privateData -Force | Out-Null
          Set-Content (Join-Path $privateData 'uninstall-test.txt') 'preserved'
          $uninstall = Start-Process -FilePath "$appDir/unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) { throw 'Uninstall failed.' }
          if ((Get-Content (Join-Path $privateData 'uninstall-test.txt')) -ne 'preserved') { throw 'Uninstall removed private data.' }
      - uses: actions/upload-artifact@v4
        with:
          name: ENGE-SPX-Windows-x64-0.15.1
          path: |
            dist/ENGE-SPX-Windows-x64-0.15.1-Portable.zip
            dist/ENGE-SPX-Windows-x64-0.15.1-Setup.exe
            dist/*.sha256
          if-no-files-found: error
  containers:
    if: ${{ !contains(github.event.head_commit.message, '[ui-hotfix]') }}
    needs: test
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate bounded client release scope
        if: env.SPX_CLIENT_RELEASE == 'true'
        run: python3 tools/check_client_release_scope.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Install host Qt image libraries for clipboard integration fixtures
        run: |
          printf 'https://mirrors.edge.kernel.org/ubuntu/\tpriority:1\n' | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=30 install -y --no-install-recommends libegl1 libgl1 libxkbcommon0
      - name: Verify real cgroup budgets, stopped updates and container data reuse
        if: env.SPX_CLIENT_RELEASE != 'true'
        run: python -u tests/integration_resources.py --context default --output "$RUNNER_TEMP/resource-results.json"
      - name: Verify real recording observes owned startup and complete stop without changing other instances
        if: env.SPX_CLIENT_RELEASE != 'true'
        run: python -u tests/integration_recording.py --context default --output "$RUNNER_TEMP/field-recording.json"
      - name: Verify profile data, recursive read-only grants and cross-instance boundaries
        if: env.SPX_CLIENT_RELEASE != 'true'
        run: python -u tests/integration_workspace_data.py --context default --output "$RUNNER_TEMP/workspace-data.json"
      - name: Verify stopped network migration, rollback and DNS/UDP/IPv6 boundaries
        if: env.SPX_CLIENT_RELEASE != 'true'
        run: python -u tests/integration_network_policy.py --context default --output "$RUNNER_TEMP/p1-network-policy.json"
      - name: Build isolated protocol fixtures
        if: env.SPX_CLIENT_RELEASE != 'true'
        run: docker build -f tools/Dockerfile.proxy-test -t spx-proxy-test .
      - name: Verify real TLS, Reality, gRPC, QUIC and fixed-chain failures
        if: env.SPX_CLIENT_RELEASE != 'true'
        run: docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=128m --cap-drop ALL --security-opt no-new-privileges --pids-limit 256 --memory 512m spx-proxy-test
      - name: Verify actual bounded HTTPS transfer, TLS rejection, redirect and drip timeout
        if: env.SPX_CLIENT_RELEASE != 'true'
        run: docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=128m --cap-drop ALL --security-opt no-new-privileges --pids-limit 256 --memory 512m --entrypoint python3 spx-proxy-test -u /opt/spx-test/integration_network_transfer.py --core /usr/local/bin/sing-box --output /tmp/network-transfer.json
      - name: Native x64 Docker integration
        env:
          PYTHONPATH: src
        run: python -u tests/integration_runtime.py --context default --output "$RUNNER_TEMP/integration-results.json" ${{ env.SPX_CLIENT_RELEASE == 'true' && '--quick-client' || '' }}
      - name: Verify two automatic exit zones without losing project data
        run: python -u tests/integration_exit_timezone.py --runtime-report "$RUNNER_TEMP/integration-results.json" --output "$RUNNER_TEMP/exit-timezone.json"
      - name: Verify local line and landing chain
        env:
          PYTHONPATH: src
        run: python -u tests/integration_chain.py --context default
      - name: Verify real Chromium identity, accounts, diagnostics and fail-closed shutdown
        if: env.SPX_CLIENT_RELEASE != 'true'
        run: python -u tests/integration_profiles.py --context default --runtime-report "$RUNNER_TEMP/integration-results.json" --output "$RUNNER_TEMP/workspace-profiles-results.json"
      - name: Measure same-runner baseline, normal and low-resource stages
        if: env.SPX_CLIENT_RELEASE != 'true'
        run: python -u tools/benchmark_resources.py --baseline e27f6579d0033915e6bd98808cee10a77496e5d1 --context default --runtime-report "$RUNNER_TEMP/integration-results.json" --output "$RUNNER_TEMP/resources-docker.json"
      - name: Retain resource and stage measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ENGE-SPX-Resource-Measurements
          path: |
            ${{ runner.temp }}/resources-docker.json
            ${{ runner.temp }}/resource-results.json
            ${{ runner.temp }}/workspace-data.json
            ${{ runner.temp }}/workspace-profiles-results.json
            ${{ runner.temp }}/p1-network-policy.json
            ${{ runner.temp }}/field-recording.json
            ${{ runner.temp }}/integration-results.json
            ${{ runner.temp }}/clipboard-native-api.json
            ${{ runner.temp }}/exit-timezone.json
            ${{ runner.temp }}/clipboard-terminal.png
          if-no-files-found: warn
      - name: Export the verified native environment
        if: github.event_name != 'pull_request'
        env:
          PYTHONPATH: src
        run: python tools/export_runtime.py --context default --report "$RUNNER_TEMP/integration-results.json" --output "$RUNNER_TEMP/runtime-package"
      - name: Install and repeat the exported archive
        if: github.event_name != 'pull_request'
        env:
          PYTHONPATH: src
        run: python -u tests/integration_prebuilt.py --context default --directory "$RUNNER_TEMP/runtime-package"
      - name: Verify archive with the classic Docker store
        if: github.event_name != 'pull_request'
        env:
          PYTHONPATH: src
        run: |
          spxClassicRoot="$RUNNER_TEMP/spx-classic"
          mkdir -p "$spxClassicRoot"
          printf '%s' '{"features":{"containerd-snapshotter":false}}' > "$spxClassicRoot/daemon.json"
          sudo dockerd --config-file "$spxClassicRoot/daemon.json" --data-root "$spxClassicRoot/data" --exec-root "$spxClassicRoot/exec" --pidfile "$spxClassicRoot/daemon.pid" --host "unix://$spxClassicRoot/docker.sock" --bridge=none --iptables=false --ip6tables=false --storage-driver=overlay2 > "$spxClassicRoot/daemon.log" 2>&1 &
          spxDaemonJob=$!
          trap 'sudo kill "$(cat "$spxClassicRoot/daemon.pid")" || true; wait "$spxDaemonJob" || true' EXIT
          for attempt in $(seq 1 60); do
            if docker --host "unix://$spxClassicRoot/docker.sock" info > /dev/null 2>&1; then break; fi
            sleep 1
          done
          docker context create spx-archive-classic --docker "host=unix://$spxClassicRoot/docker.sock"
          python -u tests/integration_prebuilt.py --context spx-archive-classic --directory "$RUNNER_TEMP/runtime-package"
      - name: Retain the verified runtime for publication
        if: github.repository == 'engeeeee/ENGE-SPX' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ENGE-SPX-Runtime-0.15.1
          path: ${{ runner.temp }}/runtime-package/*
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
  reuse_runtime:
    if: contains(github.event.head_commit.message, '[ui-hotfix]')
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify UI-only scope and reuse the published runtime bytes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/reuse_ui_hotfix_runtime.py --output "$RUNNER_TEMP/runtime-package"
      - uses: actions/upload-artifact@v4
        with:
          name: ENGE-SPX-Runtime-0.15.1
          path: ${{ runner.temp }}/runtime-package/*
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
  release:
    needs: [package, containers, reuse_runtime]
    if: always() && needs.package.result == 'success' && (needs.containers.result == 'success' || needs.reuse_runtime.result == 'success') && github.repository == 'engeeeee/ENGE-SPX' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ENGE-SPX-Windows-x64-0.15.1
          path: verified-package
      - uses: actions/download-artifact@v4
        with:
          name: ENGE-SPX-Runtime-0.15.1
          path: verified-runtime
      - name: Publish the verified ENGE SPX release
        uses: actions/github-script@v7
        with:
          script: |
            await require('./tools/publish_release.cjs')({github, context, core});
